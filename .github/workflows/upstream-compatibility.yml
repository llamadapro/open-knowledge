name: Upstream Compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork:
    name: Fork full check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck
      - name: Test with documented upstream probes quarantined
        run: |
          set -euo pipefail
          pids=()
          pnpm exec turbo run test \
            --filter='!@inkeep/open-knowledge' \
            --filter='!@inkeep/open-knowledge-desktop' \
            --filter='!@inkeep/open-knowledge-server' &
          pids+=("$!")
          pnpm --filter @inkeep/open-knowledge exec vitest run \
            --exclude src/mcp/keepalive-orphan-reaping.test.ts &
          pids+=("$!")
          pnpm --filter @inkeep/open-knowledge-desktop exec vitest run \
            --exclude tests/unit/desktop-host-contract-single-source.test.ts &
          pids+=("$!")
          pnpm --filter @inkeep/open-knowledge-server exec vitest run \
            --exclude src/timeline-query.test.ts &
          pids+=("$!")

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Verify upstream server history performance in isolation
        run: >-
          pnpm --filter @inkeep/open-knowledge-server exec vitest run
          src/timeline-query.test.ts
      - name: Verify upstream desktop contract in isolation
        run: >-
          pnpm --filter @inkeep/open-knowledge-desktop exec vitest run
          tests/unit/desktop-host-contract-single-source.test.ts
      - name: Probe upstream MCP orphan reaping
        continue-on-error: true
        run: >-
          pnpm --filter @inkeep/open-knowledge exec vitest run
          src/mcp/keepalive-orphan-reaping.test.ts

  latest-upstream-stable:
    name: Latest upstream stable baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check out latest stable release
        run: |
          set -euo pipefail
          tag="$(gh api repos/inkeep/open-knowledge/releases/latest --jq .tag_name)"
          git fetch --force https://github.com/inkeep/open-knowledge.git "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "${tag}"
          echo "Testing inkeep/open-knowledge ${tag} at $(git rev-parse HEAD)"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck
      - name: Test with documented upstream probes quarantined
        run: |
          set -euo pipefail
          pids=()
          pnpm exec turbo run test \
            --filter='!@inkeep/open-knowledge' \
            --filter='!@inkeep/open-knowledge-desktop' \
            --filter='!@inkeep/open-knowledge-server' &
          pids+=("$!")
          pnpm --filter @inkeep/open-knowledge exec vitest run \
            --exclude src/mcp/keepalive-orphan-reaping.test.ts &
          pids+=("$!")
          pnpm --filter @inkeep/open-knowledge-desktop exec vitest run \
            --exclude tests/unit/desktop-host-contract-single-source.test.ts &
          pids+=("$!")
          pnpm --filter @inkeep/open-knowledge-server exec vitest run \
            --exclude src/timeline-query.test.ts &
          pids+=("$!")

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Verify upstream server history performance in isolation
        run: >-
          pnpm --filter @inkeep/open-knowledge-server exec vitest run
          src/timeline-query.test.ts
      - name: Verify upstream desktop contract in isolation
        run: >-
          pnpm --filter @inkeep/open-knowledge-desktop exec vitest run
          tests/unit/desktop-host-contract-single-source.test.ts
      - name: Probe upstream MCP orphan reaping
        continue-on-error: true
        run: >-
          pnpm --filter @inkeep/open-knowledge exec vitest run
          src/mcp/keepalive-orphan-reaping.test.ts
